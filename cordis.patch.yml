# dsh-plugin-doubao 组合包补丁。
#
# 一行 insert 即挂载 Host 半身：整个插件就是一个包，既是组合包也是插件本身
# （与 dsh-our-free-model、dsh-experimental-tool-worktree 同样的自插入写法）。
#
# 默认不启用任何工具开关以外的副作用：签到必须显式调用才会动客户端进程。
- insert:
    - id: plugin-doubao
      name: 'dsh-plugin-doubao'
      config:
        cdpPort: 9222
        relaunchClient: false
        autoDiscoverClient: true