# dsh-doubao-signin 组合包补丁。
#
# 一行 insert 即挂载 Host 半身：整个插件就是一个包，既是组合包也是插件本身
# （与 dsh-our-free-model、dsh-experimental-tool-worktree 同样的自插入写法）。
#
# 默认不启用任何工具开关以外的副作用：签到必须显式调用才会动客户端进程。
- insert:
    - id: dsh-doubao-signin
      name: 'dsh-doubao-signin'
      config:
        cdpPort: 9222
        # B 路线：直连被风控时，自动重启客户端带调试端口、用页面 fetch 中继兜底。
        # 代价：这些回合会在豆包客户端/手机同步里留下对话记录（用户已确认接受）。
        # 不想要记录就用直连、不装客户端；这两条在豆包协议下互斥。
        relaunchClient: true
        autoDiscoverClient: true